services:
  php:
    build:
      context: ./docker
    volumes:
      - .:/var/www/html
    environment:
      - XDEBUG_MODE=coverage
      # AI agent markers, passed through from the host when set, so
      # laravel/agent-detector sees the agent inside the container too.
      - AI_AGENT
      - CLAUDECODE
      - CLAUDE_CODE
      - CLAUDE_CODE_IS_COWORK
      - CURSOR_AGENT
      - GEMINI_CLI
      - CODEX_SANDBOX
      - CODEX_CI
      - CODEX_THREAD_ID
      - AUGMENT_AGENT
      - OPENCODE_CLIENT
      - OPENCODE
      - AMP_CURRENT_THREAD_ID
      - REPL_ID
      - COPILOT_MODEL
      - COPILOT_ALLOW_ALL
      - COPILOT_CLI
      - ANTIGRAVITY_AGENT
      - PI_CODING_AGENT
      - KIRO_AGENT_PATH
  composer:
    extends:
      service: php
    volumes:
      - .:/var/www/html
      - ~/.cache/composer:/.composer/cache
    entrypoint: [ "composer" ]
  testbench:
    extends:
      service: php
    volumes:
      - .:/var/www/html
    entrypoint: [ "vendor/bin/testbench" ]
  serve:
    extends:
      service: php
    volumes:
      - .:/var/www/html
    environment:
      - COMPOSER_HOME=/tmp/composer
    ports:
      - "8000:8000"
    entrypoint: [ "composer", "serve" ]
  queue:
    extends:
      service: php
    volumes:
      - .:/var/www/html
    entrypoint: [ "vendor/bin/testbench", "queue:work", "database", "--sleep=1" ]
