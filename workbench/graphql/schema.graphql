type Query {
    hello(name: String): String! @field(resolver: "Workbench\\App\\GraphQL\\Resolvers@hello")
    boom: String @field(resolver: "Workbench\\App\\GraphQL\\Resolvers@boom")
}

type Mutation {
    login(email: String!, password: String!): Boolean! @field(resolver: "Workbench\\App\\GraphQL\\Resolvers@login")
}
