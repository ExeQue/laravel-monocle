name: Feature request
description: Propose a new lens, option or dashboard feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to find out or do that Monocle does not help with today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Monocle should record or show, and where (a lens, the dashboard, an MCP tool, config).
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Will you open the pull request?
      options:
        - "Yes"
        - "Maybe, with some help"
        - "No"
    validations:
      required: true
