name: Tests

on:
  # Only main: pushes to it, and pull requests that target it - and only when
  # something that can change the outcome of the suite changed.
  push:
    branches: [ "main" ]
    paths: &code
      - 'src/**'
      - 'config/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.dashboard.config.js'
      - 'composer.json'
      - 'phpunit.xml'
      - 'pint.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths: *code
  workflow_dispatch:

# Runs from maintainers start right away. Pull requests from outside
# contributors wait for a maintainer to approve the run - that is a
# repository setting ("Require approval for all external contributors").
#
# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, intl, gd, exif, fileinfo
          coverage: none

      # Formatting Blade files runs prettier.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction
          npm ci

      - name: Check code and Blade formatting
        run: composer lint:test

  test:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        stability: [prefer-stable]

    name: PHP-${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  coverage:
    needs: lint
    runs-on: ubuntu-latest

    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Fails the build when line coverage drops below 90 %.
      - name: Execute tests with coverage
        run: vendor/bin/pest -p --ci --coverage --min=90

  assets:
    # The compiled dashboard assets ship in the repository; fail when they
    # do not match their sources.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the dashboard assets
        run: |
          npm ci
          npm run build

      - name: Check the committed build is current
        run: git diff --exit-code -- resources/dist
