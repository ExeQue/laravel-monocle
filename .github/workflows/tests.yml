name: Tests

on:
  # Only main: pushes to it, and pull requests that target it.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Every run waits for a maintainer: the "tests" environment has required
    # reviewers configured in the repository settings.
    environment: tests

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        stability: [prefer-stable]

    name: PHP-${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  coverage:
    runs-on: ubuntu-latest

    environment: tests

    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Fails the build when line coverage drops below 90 %.
      - name: Execute tests with coverage
        run: vendor/bin/pest -p --ci --coverage --min=90
