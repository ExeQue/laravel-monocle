name: Tests

on:
  # Only main: pushes to it, and pull requests that target it - and only when
  # something that can change the outcome of the suite changed.
  push:
    branches: [ "main" ]
    paths: &code
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths: *code
  workflow_dispatch:

# Runs from maintainers start right away. Pull requests from outside
# contributors wait for a maintainer to approve the run - that is a
# repository setting ("Require approval for all external contributors").
#
# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        stability: [prefer-stable]

    name: PHP-${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest -p --ci

  coverage:
    runs-on: ubuntu-latest

    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # Fails the build when line coverage drops below 90 %.
      - name: Execute tests with coverage
        run: vendor/bin/pest -p --ci --coverage --min=90
