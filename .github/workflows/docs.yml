name: Documentation

on:
  push:
    branches: [ "main" ]
    # A release tag deploys; path filters do not apply to tags.
    tags: [ 'v*' ]
    paths: &docs
      - 'README.md'
      - 'LICENSE.md'
      - 'docs/**'
      - 'art/**'
      - '.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths: *docs
  workflow_dispatch:

# Every run builds: VitePress fails on a dead link, which is the check that matters.
# Only a release tag or a manual run deploys, so the site matches the released package.
#
# Nothing here reads a secret, and the write permissions the deployment needs are
# granted to that job alone - the build runs the repository's own npm scripts, and
# has no business holding a token that can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # for lastUpdated timestamps

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - name: Upload the artifact
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
