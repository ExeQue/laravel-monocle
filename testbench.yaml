laravel: '@testbench'

providers:
  - Laravel\Mcp\Server\McpServiceProvider
  - Laravel\Ai\AiServiceProvider
  - Prism\Prism\PrismServiceProvider
  - Livewire\LivewireServiceProvider
  - RyanChandler\BladeCaptureDirective\BladeCaptureDirectiveServiceProvider
  - BladeUI\Icons\BladeIconsServiceProvider
  - BladeUI\Heroicons\BladeHeroiconsServiceProvider
  - Kirschbaum\PowerJoins\PowerJoinsServiceProvider
  - Filament\Support\SupportServiceProvider
  - Filament\Actions\ActionsServiceProvider
  - Filament\Schemas\SchemasServiceProvider
  - Filament\Forms\FormsServiceProvider
  - Filament\Infolists\InfolistsServiceProvider
  - Filament\Notifications\NotificationsServiceProvider
  - Filament\Tables\TablesServiceProvider
  - Filament\Widgets\WidgetsServiceProvider
  - Filament\FilamentServiceProvider
  - Laravel\Pennant\PennantServiceProvider
  - Spatie\ResponseCache\ResponseCacheServiceProvider
  - Spatie\MediaLibrary\MediaLibraryServiceProvider
  - Laravel\Sanctum\SanctumServiceProvider
  - Lab404\Impersonate\ImpersonateServiceProvider
  - Laravel\Folio\FolioServiceProvider
  - Inertia\ServiceProvider
  - ExeQue\Monocle\MonocleServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - APP_NAME="Monocle Demo"
  - APP_ENV=local
  - APP_DEBUG=true
  - APP_KEY=base64:akJ7vn9BpDVeT/oS+fyl2B768eJ8u6vBKsm6C5/94pk=
  - APP_URL=http://localhost:8000
  - AUTH_MODEL=Workbench\App\Models\User
  - DB_CONNECTION=sqlite
  - CACHE_STORE=file
  - SESSION_DRIVER=file
  - QUEUE_CONNECTION=sync
  - MAIL_MAILER=log
  - PENNANT_STORE=array
  - RESPONSE_CACHE_DRIVER=file
  - MONOCLE_ENABLED=true

workbench:
  start: '/'
  install: false
  health: false
  discovers:
    web: true
    api: true
    commands: false
    components: false
    factories: true
    views: true
  build:
    - migrate-fresh
    - filament:assets
